/* ---- design/tokens.css, inlined verbatim (scaffold convention: no separate stylesheet request) ---- */
:root{
  /* color */
  --sd-bg: #EFE8DB;            /* app background — one step below paper */
  --sd-card: #FBF7EF;          /* card surface = the illustrations' paper. Never themed. */
  --sd-ink: #211B12;
  --sd-ink-2: #6E6455;
  --sd-accent: #2F6B3F;        /* vermouth green */
  --sd-accent-pressed: #24522F;
  --sd-save: var(--sd-accent); /* swipe right — saving IS the brand action */
  --sd-skip: #A03B2E;          /* swipe left — muted brick red, still gesture feedback not error */
  --sd-line: rgba(33,27,18,.14);
  /* text on card paper: the paper never themes, so neither does its ink */
  --sd-paper-ink: #211B12;
  --sd-paper-ink-2: #6E6455;
  --sd-paper-accent: #2F6B3F;
  --sd-chrome: var(--sd-card);
  --sd-shadow: 0 1px 2px rgba(33,27,18,.06), 0 12px 32px -12px rgba(33,27,18,.25);

  /* type */
  --sd-font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sd-font-ui: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* motion */
  --sd-ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.35); /* the only overshoot in the app */
  --sd-ease-fly:    cubic-bezier(0.33, 0.85, 0.55, 1);      /* inherits finger velocity, lands soft */
  --sd-ease-flip:   cubic-bezier(0.4, 0.1, 0.15, 1);
  --sd-ease-list:   cubic-bezier(0.2, 0, 0, 1);
  --sd-t-spring: 420ms;  --sd-t-fly: 320ms;  --sd-t-flip: 480ms;
  --sd-t-list: 240ms;    --sd-t-micro: 140ms;
}

@media (prefers-color-scheme: dark){
  :root{
    --sd-bg: #17130E;
    --sd-ink: #EDE5D6;
    --sd-ink-2: #A79B87;
    --sd-accent: #7FB56F;
    --sd-accent-pressed: #9CCB8A; /* pressed goes LIGHTER on dark */
    --sd-skip: #DE8070;
    --sd-line: rgba(237,229,214,.16);
    --sd-chrome: var(--sd-bg);
    --sd-shadow: 0 2px 4px rgba(0,0,0,.4), 0 16px 40px -12px rgba(0,0,0,.6);
    /* --sd-card intentionally unchanged — the illustrations are painted on warm-white
       paper regardless of theme; the deck reads as lit cards on a dark bar top. */
  }
}

@media (prefers-reduced-motion: reduce){
  :root{ --sd-t-spring: 0ms; --sd-t-fly: 0ms; --sd-t-flip: 0ms; --sd-t-list: 0ms; --sd-t-micro: 0ms; }
}

/* Work Sans defaults to proportional oldstyle figures — force this on every amount display. */
.amount{ font: 500 16px/1.4 var(--sd-font-ui); font-variant-numeric: lining-nums tabular-nums; }

/* ---- scaffold layout (BACKLOG item 1) ---- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100dvh;font:400 16px/1.5 var(--sd-font-ui);background:var(--sd-bg);color:var(--sd-ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:640px;margin:0 auto;padding:1.25rem 1.25rem calc(6rem + env(safe-area-inset-bottom))}
/* T11: one header row, wordmark, search, "Pick for me" */
header.brand{display:flex;align-items:center;gap:.5rem;padding:.25rem 0 .75rem}
header.brand>a{display:inline-flex;align-items:center;min-height:44px;margin-right:auto}
header.brand .wordmark{color:var(--sd-ink);width:84px;height:auto;display:block}
.wheel-entry{position:relative;display:flex;align-items:center;gap:.45rem;height:40px;padding:0 .8rem 0 .4rem;
  border-radius:999px;background:var(--sd-paper-accent);color:#FBF7EF;white-space:nowrap;
  font:600 13px/1 var(--sd-font-ui);box-shadow:0 8px 24px -16px rgba(33,27,18,.45);
  transition:transform var(--sd-t-micro) var(--sd-ease-list),box-shadow var(--sd-t-micro) linear}
.wheel-entry:hover{transform:translateY(-1px);box-shadow:var(--sd-shadow)}
.wheel-entry:active{transform:translateY(0) scale(.98)}
.wheel-entry:focus-visible{outline:3px solid var(--sd-accent);outline-offset:3px}
.wheel-entry[hidden]{display:none}
.wheel-entry[aria-disabled="true"]{opacity:.6;cursor:progress}
.wheel-symbol{width:28px;height:28px;flex:0 0 28px;display:block;border-radius:50%;box-shadow:0 0 0 2px #FBF7EF}
.header-icons{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
/* 40 px visual, 44 px hit area through the ::after overhang */
.search-entry{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;
  border:1px solid var(--sd-line);border-radius:999px;background:var(--sd-card);color:#211B12;
  box-shadow:0 8px 24px -16px rgba(33,27,18,.45);transition:transform var(--sd-t-micro) var(--sd-ease-list),box-shadow var(--sd-t-micro) linear}
.search-entry::after,.wheel-entry::after,.fchip::after{content:"";position:absolute;inset:-5px -2px}
.search-entry:hover{transform:translateY(-1px);box-shadow:var(--sd-shadow)}
.search-entry:active{transform:translateY(0) scale(.98)}
.search-entry:focus-visible{outline:3px solid var(--sd-accent);outline-offset:3px}
.search-symbol{width:20px;height:20px}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;display:flex;background:var(--sd-chrome);
  border-top:1px solid var(--sd-line);box-shadow:var(--sd-shadow);z-index:10;
  padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:641px){.bottom-nav{border:1px solid var(--sd-line);border-bottom:0;border-radius:16px 16px 0 0}}
.bottom-nav a{flex:1;text-align:center;padding:.75rem .25rem;font:500 12px/1.2 var(--sd-font-ui);
  letter-spacing:.03em;color:var(--sd-ink-2);border-top:2px solid transparent;
  min-height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:.3rem}
.bottom-nav a.active{color:var(--sd-accent);border-top-color:var(--sd-accent)}
.nav-count{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--sd-paper-accent);color:#FBF7EF;font:600 10px/1 var(--sd-font-ui);font-variant-numeric:tabular-nums}

.screen-title{font:400 2rem/1.1 var(--sd-font-display);margin-bottom:1rem}
.empty{color:var(--sd-ink-2);text-align:center;padding:3rem 1rem}
.empty-action{text-align:center;margin-top:-1.5rem}
.pill-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 1.2rem;border-radius:999px;
  background:var(--sd-paper-accent);color:#FBF7EF;font:600 .85rem/1 var(--sd-font-ui)}
.list-card{background:var(--sd-card);color:var(--sd-paper-ink);border-radius:12px;box-shadow:var(--sd-shadow);padding:1rem 1.1rem;
  margin-bottom:.75rem}
.list-card .name{font:400 1.3rem/1.2 var(--sd-font-display)}
.list-card .meta{font:500 .8rem/1.4 var(--sd-font-ui);color:var(--sd-paper-ink-2);margin-top:.15rem}
.filter-toggle{display:flex;align-items:center;gap:.45rem}
.filter-toggle input{accent-color:var(--sd-accent);width:1rem;height:1rem}
/* T11 filter chips: scroll sideways, never wrap */
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -1.25rem .9rem;padding:5px 1.25rem}
.fchips::-webkit-scrollbar{display:none}
.fchip{position:relative;flex:none;display:flex;align-items:center;gap:.3rem;height:34px;padding:0 13px;border-radius:999px;
  border:1px solid rgba(33,27,18,.16);background:#FBF7EF;color:#211B12;font:500 12px/1 var(--sd-font-ui);white-space:nowrap}
.fchip.on{background:var(--sd-ink);border-color:var(--sd-ink);color:var(--sd-bg)}
.fchip .amount{font:inherit;font-variant-numeric:tabular-nums}
.fchip:focus-visible,.fchip:focus-within{outline:3px solid var(--sd-accent);outline-offset:2px}
.fchip-select select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}

/* ---- deck & cards (BACKLOG item 4) ---- */
.deck{position:relative;height:clamp(340px,calc(100dvh - 300px),540px);max-width:340px;margin:0 auto 1.9rem;perspective:1200px}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;margin:0 auto}
.deck-actions button{height:48px;border-radius:999px;font:600 13.5px/1 var(--sd-font-ui)}
.deck-skip{border:1px solid var(--sd-line);color:var(--sd-skip)}
.deck-save{background:var(--sd-paper-accent);color:#FBF7EF}
.card{position:absolute;inset:0;border-radius:16px;touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;
  transition:transform var(--sd-t-list) var(--sd-ease-list)}
.card:focus-visible{outline:3px solid var(--sd-accent);outline-offset:3px}
.card[data-depth="1"]{transform:translateY(12px) scale(.964);pointer-events:none}
.card[data-depth="2"]{transform:translateY(24px) scale(.928);pointer-events:none}
.card[data-depth="3"]{transform:translateY(24px) scale(.928);opacity:0;pointer-events:none}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform var(--sd-t-flip) var(--sd-ease-flip)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.flipped{touch-action:pan-y}
/* faces live on the illustrations' paper: fixed paper-ink palette, never dark-mode inverted */
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--sd-card);color:#211B12;border-radius:16px;box-shadow:var(--sd-shadow);
  padding:1.1rem;display:flex;flex-direction:column;overflow:hidden}
.card-back{transform:rotateY(180deg)}
.card-name{font:400 1.6rem/1.15 var(--sd-font-display);margin:.4rem 0 .1rem}
.card-title{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin:.4rem 0 .1rem}
.card-title .card-name{margin:0;min-width:0}
.flip-hint{font:500 11px/1 var(--sd-font-ui);color:var(--sd-paper-ink-2);white-space:nowrap}
.card-meta{font:500 .8rem/1.4 var(--sd-font-ui);color:#6E6455}
.card-art{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.glass-ph{width:38%;max-height:100%;color:#6E6455;opacity:.55}
.cocktail-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
  pointer-events:none;-webkit-user-drag:none;
  transition:opacity var(--sd-t-list) var(--sd-ease-list)}
.cocktail-art.loaded{opacity:1}
.card-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.chip{border:1px solid rgba(33,27,18,.18);border-radius:999px;padding:.12rem .6rem;
  font:500 .72rem/1.4 var(--sd-font-ui);color:var(--sd-paper-ink)}
.chip.missing{color:var(--sd-paper-ink-2);border-style:dashed}
/* T12: ruled ingredient rows, garnish in ink-2 with its own tag */
.ing{list-style:none;margin:.6rem 0 .7rem;border-top:1px solid rgba(33,27,18,.12)}
.ing li{display:grid;grid-template-columns:2.9rem 1fr auto;gap:.6rem;padding:.42rem 0;
  border-bottom:1px solid rgba(33,27,18,.12);font:400 .875rem/1.35 var(--sd-font-ui)}
.ing li .amount{text-align:right;font-size:.875rem;line-height:1.35}
.ing li.garnish,.fav-ing-row.garnish{color:#6E6455}
.missing-tag{align-self:center;font:600 10.5px/1 var(--sd-font-ui);letter-spacing:.04em;
  text-transform:uppercase;color:#A03B2E}
.garnish-tag{align-self:center;font:500 11px/1 var(--sd-font-ui);color:#6E6455}
.card-back>.card-name{flex-shrink:0;margin-top:0}
.card-recipe{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin}
.card-method{font:400 .82rem/1.5 var(--sd-font-ui);color:#211B12}
.card-ctrl{margin-top:auto;padding-top:.7rem;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:.5rem;flex-shrink:0}
.card-source{margin-top:.5rem;text-align:right;font:500 10.5px/1 var(--sd-font-ui);color:#6E6455;flex-shrink:0}
/* F1 variants: the chip on the front, the segmented control on the back, the diff against the primary */
.chip.variant-chip{background:#211B12;border-color:#211B12;color:#FBF7EF;font:600 11px/1.4 var(--sd-font-ui)}
.variant-seg{display:flex;gap:2px;height:34px;padding:2px;margin-bottom:.6rem;flex-shrink:0;
  border:1px solid rgba(33,27,18,.18);border-radius:999px}
.variant-seg button{position:relative;flex:1 1 auto;min-width:0;padding:0 .6rem;border-radius:999px;color:#211B12;
  font:500 12.5px/1 var(--sd-font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.variant-seg button::after{content:"";position:absolute;inset:-8px 0}
.variant-seg button[aria-pressed="true"]{background:#211B12;color:#FBF7EF;font-weight:600}
.variant-seg button:focus-visible{outline:3px solid #2F6B3F;outline-offset:2px}
.line-tags{display:flex;align-items:center;gap:.4rem}
.diff-tag{align-self:center;font:500 11px/1 var(--sd-font-ui);color:#6E6455;white-space:nowrap}
.diff-new{font-weight:600;color:#2F6B3F}
.variant-without{margin:-.3rem 0 .7rem;font:400 .8rem/1.4 var(--sd-font-ui);color:#6E6455}
.fav-ing-list+.variant-without{margin:.6rem 0 0}
.search-group{margin:1rem 0 .5rem;font:600 11px/1.3 var(--sd-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--sd-ink-2)}
/* T12 segmented controls. The top card is unscaled, so 44 px segments measure 44 on screen. */
.stepper,.units{display:flex;align-items:center;height:44px;flex-shrink:0;border:1px solid rgba(33,27,18,.18);
  border-radius:999px;overflow:hidden;color:#211B12}
.stepper button,.units button{min-width:44px;height:44px;padding:0;border:0;border-radius:0;background:none;color:#211B12;
  font:500 12.5px/1 var(--sd-font-ui)}
.stepper button{font-size:1rem}
.servings-input{width:44px;height:44px;padding:0;border:0;background:transparent;color:#211b12;text-align:right;

.servings-input::-webkit-inner-spin-button,.servings-input::-webkit-outer-spin-button{appearance:none;margin:0}

.units button.active{background:#211B12;color:#FBF7EF}

  transition:opacity var(--sd-t-micro) linear}
.tint-save{box-shadow:inset 0 0 0 3px #2F6B3F}
.tint-skip{box-shadow:inset 0 0 0 3px #A03B2E}

.swipe-label{position:absolute;top:1.2rem;padding:.3rem .55rem;border:2px solid;border-radius:8px;opacity:0;pointer-events:none;
  font:600 13px/1 var(--sd-font-ui);letter-spacing:.08em;text-transform:uppercase;background:rgba(251,247,239,.9);
  transition:opacity var(--sd-t-micro) linear}
.swipe-label-save{left:1.1rem;color:#2F6B3F;transform:rotate(-8deg)}
.swipe-label-skip{right:1.1rem;color:#A03B2E;transform:rotate(8deg)}
.toast{position:fixed;left:50%;bottom:calc(4.5rem + env(safe-area-inset-bottom));z-index:20;transform:translateX(-50%);
  display:flex;align-items:center;gap:.4rem;padding:.2rem .3rem .2rem 1rem;border-radius:999px;background:#211B12;color:#FBF7EF;
  box-shadow:var(--sd-shadow);font:500 .85rem/1 var(--sd-font-ui);white-space:nowrap}
.toast[hidden]{display:none}
.toast span::after{content:" ·"}
.toast button{min-height:44px;padding:0 .8rem;color:#FBF7EF;font-weight:600;text-decoration:underline;text-underline-offset:3px}
dl.settings{display:grid;grid-template-columns:auto 1fr;gap:.6rem 1rem;font-size:.95rem;margin-bottom:1.5rem}
dl.settings dt{color:var(--sd-ink-2)}
dl.settings dd{min-width:0}
dl.settings .fav-hint{color:var(--sd-ink-2)}
.list-card .fav-remove{color:var(--sd-paper-ink-2)}
.account{margin:1.5rem 0;padding-top:1rem;border-top:1px solid var(--sd-line)}
.account h2{font:400 1.3rem/1.2 var(--sd-font-display);margin-bottom:.5rem}
.account p{font:400 .88rem/1.4 var(--sd-font-ui);color:var(--sd-ink-2);margin-bottom:.6rem}
.account-actions{display:flex;gap:.5rem;flex-wrap:wrap}
/* Google-knappen: developers.google.com/identity/branding-guidelines, ljust tema. Roboto bara lokalt, CSP font-src 'self'. */
.account .gsi{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:20px;font-family:Roboto,system-ui,sans-serif;font-weight:500;font-size:14px;line-height:20px;letter-spacing:.25px}
.account .gsi:hover{background:#f6f6f6}
.gsi-logo{width:20px;height:20px;flex:none}
.account button{border:1px solid rgba(33,27,18,.18);border-radius:8px;padding:.45rem .8rem;
  color:#211B12;font:500 .82rem/1.2 var(--sd-font-ui);background:var(--sd-card)}
.account a{text-decoration:underline;text-underline-offset:2px}
.account-form label{display:block;font:500 .82rem/1.3 var(--sd-font-ui);color:var(--sd-ink-2);margin:.6rem 0 .3rem}
.account-form input{display:block;width:100%;margin-top:.25rem;padding:.5rem .6rem;border:1px solid rgba(33,27,18,.18);
  border-radius:8px;font:400 .9rem/1.2 var(--sd-font-ui);color:#211B12;background:var(--sd-card)}
.warn{color:var(--sd-skip);font:500 .8rem/1.4 var(--sd-font-ui);margin-top:.5rem}
.lang-toggle{display:flex;gap:.3rem;flex-wrap:wrap}
.lang-toggle button{border:1px solid var(--sd-line);border-radius:8px;padding:.35rem .65rem;
  color:var(--sd-ink);font:500 .82rem/1.2 var(--sd-font-ui)}
.lang-toggle button.active{background:var(--sd-accent);border-color:var(--sd-accent);color:var(--sd-bg)}
/* fas 4: the account folds to one row after the other settings */
details.account summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:44px;
  cursor:pointer;list-style:none;font:500 .95rem/1.3 var(--sd-font-ui)}
details.account summary::-webkit-details-marker{display:none}
details.account summary:focus-visible{outline:3px solid var(--sd-accent);outline-offset:3px;border-radius:8px}
.account-who{display:block;font:400 .8rem/1.3 var(--sd-font-ui);color:var(--sd-ink-2)}
.account-chevron{font-size:1.3rem;color:var(--sd-ink-2);transition:transform var(--sd-t-micro) var(--sd-ease-list)}

#accBody{padding-top:.5rem}
.account button,.account .gsi{min-height:44px}

.account-modes{display:flex;margin:1rem 0 .2rem;border:1px solid rgba(33,27,18,.18);border-radius:999px;overflow:hidden;background:var(--sd-card)}
.account .account-modes button{flex:1;border:0;border-radius:0;background:none}
.account .account-modes button[aria-pressed="true"]{background:#211B12;color:#FBF7EF}
.account-form{margin-bottom:1rem}
.account-form .account-actions{margin-top:.9rem;align-items:center}
.account .account-primary{background:var(--sd-paper-accent);border-color:var(--sd-paper-accent);color:#FBF7EF;font-weight:600}
.account .account-link{border:0;background:none;color:var(--sd-ink-2);text-decoration:underline;text-underline-offset:2px}
.account .danger{color:#A03B2E;border-color:#A03B2E}
.confirm-dialog{margin:auto;width:min(360px,calc(100% - 32px));padding:1.25rem;border:0;border-radius:16px;
  background:var(--sd-card);color:#211B12;box-shadow:var(--sd-shadow)}
.confirm-dialog::backdrop{background:rgba(23,19,14,.5)}
.confirm-dialog h2{font:400 1.4rem/1.2 var(--sd-font-display)}
.account .confirm-dialog p{color:#6E6455;margin:.5rem 0 1rem}
.confirm-dialog .account-actions{justify-content:flex-end}

/* ---- favorites: compact art rows + continuous recipe detail ---- */
.fav-row{display:flex;align-items:center;gap:.55rem;color:#211B12}
.fav-open{display:flex;align-items:center;gap:.85rem;flex:1;min-width:0;text-align:left;color:#211B12}
.fav-open:focus-visible,.fav-copy:focus-visible{outline:3px solid var(--sd-accent);outline-offset:2px}
.fav-thumb{position:relative;width:64px;height:80px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;background:var(--sd-card);border-radius:8px;overflow:hidden}
.fav-thumb .glass-ph{width:58%;opacity:.6}
.fav-info{display:block;flex:1;min-width:0}
.fav-info .name,.fav-info .meta{display:block}
.fav-missing{display:block;font:500 .76rem/1.4 var(--sd-font-ui);color:var(--sd-paper-ink-2);margin-top:.1rem}
.fav-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;gap:.5rem}
.fav-back,.fav-remove{border:1px solid rgba(33,27,18,.18);border-radius:8px;padding:.35rem .65rem;
  color:var(--sd-ink-2);font:500 .78rem/1.2 var(--sd-font-ui)}
.fav-detail{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
.fav-hero,.fav-recipe{background:var(--sd-card);color:#211B12;border-radius:16px;box-shadow:var(--sd-shadow);
  padding:1.1rem}
.fav-detail-art{position:relative;height:min(52vh,360px);display:flex;align-items:center;justify-content:center}
.fav-detail-art .glass-ph{width:35%;max-height:80%;color:#6E6455;opacity:.55}
.fav-recipe h2,.fav-recipe h3{font:600 1rem/1.3 var(--sd-font-ui)}
.fav-recipe h3{margin-top:1.25rem}
.fav-recipe-controls{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;
  margin:.8rem 0 1.2rem}
.fav-hint{color:var(--sd-paper-ink-2);font:.8rem/1.4 var(--sd-font-ui);margin:.25rem 0 .65rem}
.fav-ing-list{border-top:1px solid rgba(33,27,18,.14)}
.fav-ing-row{display:grid;grid-template-columns:auto 4.8rem 1fr auto;align-items:center;gap:.55rem;
  padding:.65rem 0;border-bottom:1px solid rgba(33,27,18,.14);font:.88rem/1.35 var(--sd-font-ui)}
.fav-ing-row input{width:1.05rem;height:1.05rem;accent-color:#2F6B3F}
.fav-ing-row .amount{text-align:right;font-size:.82rem}
.fav-ing-row.done span{text-decoration:line-through;color:#6E6455}
.fav-method{margin-top:.45rem;font:.88rem/1.55 var(--sd-font-ui)}
.fav-source{text-align:right;margin-top:.7rem;font:500 .7rem/1.4 var(--sd-font-ui);color:#6E6455}
.fav-source a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.fav-source a:focus-visible{outline:2px solid #2F6B3F;outline-offset:3px}
.fav-copy{margin-top:1.25rem;border-radius:9px;padding:.65rem .9rem;background:#2F6B3F;color:#FBF7EF;
  font:600 .85rem/1.2 var(--sd-font-ui)}

/* ---- F2 own drinks + F3 suggestions (4a, lofi in the existing style) ---- */
.chip.custom-chip{background:#2F6B3F;border-color:#2F6B3F;color:#FBF7EF;font:600 11px/1.4 var(--sd-font-ui)}
.fav-tools{display:flex;gap:.5rem}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1.8rem 0 .75rem}
.section-head .pantry-almost-title{margin:0}
.custom-form fieldset{border:0;margin:1rem 0 0}
.custom-form legend{font:500 .82rem/1.3 var(--sd-font-ui);color:var(--sd-ink-2);margin-bottom:.4rem}
.custom-form textarea,.custom-line select{display:block;width:100%;margin-top:.25rem;padding:.5rem .6rem;border:1px solid rgba(33,27,18,.18);
  border-radius:10px;font:400 .9rem/1.35 var(--sd-font-ui);color:#211B12;background:var(--sd-card);resize:vertical}
.custom-form input:not([type=radio]):not([type=checkbox]){min-height:44px;border-radius:10px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.6rem}
.custom-form .pick{position:relative;display:flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid rgba(33,27,18,.16);border-radius:999px;
  background:#FBF7EF;color:#211B12;font:500 13px/1 var(--sd-font-ui);cursor:pointer}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.custom-form .pick:has(:checked){background:var(--sd-ink);border-color:var(--sd-ink);color:var(--sd-bg)}
.pick:has(:focus-visible){outline:3px solid var(--sd-accent);outline-offset:2px}
@media (prefers-color-scheme:dark){.custom-form .pick:has(:checked){background:var(--sd-accent);border-color:var(--sd-accent)}}
.custom-form .pick[style]{width:44px;padding:0;background:var(--swatch);border-color:rgba(33,27,18,.25)}
.custom-form .pick[style]:has(:checked){background:var(--swatch);box-shadow:inset 0 0 0 3px #FBF7EF,0 0 0 2px var(--sd-ink)}
.custom-line{display:grid;grid-template-columns:4rem 4.8rem minmax(0,1fr) 44px;gap:6px;align-items:center;margin-bottom:6px}
.custom-line input,.custom-line select{margin:0 !important;min-height:44px}
.custom-line input[name=amount]{text-align:right;font-variant-numeric:tabular-nums}
.custom-line button{height:44px;color:var(--sd-ink-2);font-size:1.2rem}
.custom-form .account-link{min-height:44px;color:var(--sd-accent);font:600 .85rem/1 var(--sd-font-ui)}
.custom-save{display:block;width:100%;height:48px;margin-top:1rem;border-radius:999px;font:600 14px/1 var(--sd-font-ui)}
.custom-save:disabled{opacity:.6}
.suggest-drink{font:400 1.5rem/1.2 var(--sd-font-display);margin-bottom:.5rem}
.suggest-similar{padding:.9rem;border-radius:16px;background:var(--sd-card);color:#211B12;box-shadow:var(--sd-shadow)}
.custom-form .suggest-similar legend{float:left;width:100%;padding:0;margin-bottom:.6rem;color:#211B12;font-weight:600}
.suggest-similar .fav-row{clear:both;gap:.85rem}
.suggest-similar .fav-thumb{width:48px;height:60px}
.suggest-similar .name{font:400 1.2rem/1.2 var(--sd-font-display)}
.suggest-similar .meta{font:500 .78rem/1.4 var(--sd-font-ui);color:#6E6455}
.suggest-similar .picks{margin:.7rem 0 0}
.custom-form .suggest-consent{display:flex;align-items:flex-start;gap:.6rem;margin-top:1rem;color:var(--sd-ink);font:400 .88rem/1.4 var(--sd-font-ui)}
.suggest-consent input{margin-top:.15rem;flex-shrink:0;width:1.2rem;height:1.2rem;accent-color:var(--sd-accent)}
.suggest-status{margin-top:1rem;font:400 .88rem/1.45 var(--sd-font-ui)}
.suggest-status a{text-decoration:underline;text-underline-offset:2px}
.suggest-open{margin-top:1rem}
#view>.fav-hint,.custom-form>.fav-hint{color:var(--sd-ink-2)} /* on the page background, not on paper */

/* ---- pantry (BACKLOG item 7) ---- */
.pantry-intro{color:var(--sd-ink-2);font-size:.88rem;margin:-.4rem 0 1.2rem}
.pantry-group{border:0;margin:0 0 1.2rem}
.pantry-group legend{font:400 1.3rem/1.2 var(--sd-font-display);margin-bottom:.55rem}
.pantry-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.pantry-item{display:flex;align-items:center;gap:.5rem;min-width:0;padding:.65rem .7rem;
  border:1px solid var(--sd-line);border-radius:10px;background:var(--sd-card);color:#211B12;
  font:500 .76rem/1.3 var(--sd-font-ui)}
.pantry-item input{accent-color:#2F6B3F;flex-shrink:0;width:1rem;height:1rem}
.pantry-item span{min-width:0}
.pantry-item[hidden]{display:none}
.pantry-count{font:600 .95rem/1.3 var(--sd-font-ui);margin:-.25rem 0 1rem;font-variant-numeric:tabular-nums}
.pantry-almost-title{font:400 1.3rem/1.2 var(--sd-font-display);margin:0 0 .55rem}
/* a sideways row: checking an item changes this row, never the height above the checkboxes */
.pantry-almost-list{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -1.25rem .2rem;padding:4px 1.25rem 24px}
.pantry-almost-list::-webkit-scrollbar{display:none}
.pantry-almost-row{display:flex;flex-direction:column;flex:0 0 11.5rem;text-align:left;color:#211B12}
.pantry-almost-row:focus-visible{outline:3px solid var(--sd-accent);outline-offset:2px}

/* ---- full-screen search, and the topbar it shares with the wheel ---- */
body.wheel-mode,body.search-mode{overflow:hidden}
body.search-mode>.wrap{max-width:none;padding:0}
body.search-mode .brand,body.search-mode .bottom-nav{display:none}
.search-body{width:min(100%,520px);margin:.2rem auto 0;padding:0 1.25rem 2rem}
.search-body .list-card{align-self:stretch}
.search-input{display:block;width:100%;margin:.5rem 0 1rem;padding:.6rem .8rem;border:1px solid rgba(33,27,18,.18);
  border-radius:8px;font:400 1rem/1.2 var(--sd-font-ui);color:#211B12;background:var(--sd-card)}
.wheel-screen{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--sd-bg);
  padding:max(.7rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right))
    max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
.wheel-topbar{width:min(100%,640px);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;min-height:46px;gap:.75rem}
.wheel-back{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;justify-self:start;padding:0 .8rem;
  min-width:44px;min-height:44px;border:1px solid var(--sd-line);border-radius:999px;color:var(--sd-ink-2);
  font:600 .74rem/1 var(--sd-font-ui)}
.wheel-top-wordmark{display:grid;place-items:center;width:90px;padding:.12rem .35rem;border-radius:10px;background:#fbf7ef}
.wheel-top-wordmark img{display:block;width:100%;height:auto}
.wheel-body{width:min(100%,520px);margin:.2rem auto 0;display:flex;flex-direction:column;align-items:center}
.wheel-back:focus-visible,#wheelLayer button:focus-visible{outline:3px solid var(--sd-accent);outline-offset:3px}

/* ---- spinning wheel (design review T14–T18): a layer over the deck, 1b ---- */
#wheelLayer .wheel-screen{background:none;padding-top:max(.35rem,env(safe-area-inset-top))}
.wheel-bg{position:fixed;inset:0;z-index:-1;background:var(--sd-bg)}
#wheelLayer .wheel-topbar{min-height:44px}
#wheelLayer .wheel-back,.wheel-sound{min-height:44px;padding:0 .2rem;border:0;border-radius:8px;color:var(--sd-ink-2);font:500 14px/1 var(--sd-font-ui)}
.wheel-sound{justify-self:end;font-size:13px}
.wheel-title{font:400 22px/1.1 var(--sd-font-display);white-space:nowrap}
#wheelLayer .wheel-body{margin-top:.15rem}
.wheel-window{width:100%;text-align:center}
.wheel-window-label{font:600 10.5px/1.3 var(--sd-font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--sd-ink-2)}
.wheel-window-name{min-height:1.15em;font:400 30px/1.15 var(--sd-font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wheel-stage{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:20px auto 0;
  filter:drop-shadow(0 14px 16px rgba(33,27,18,.14))}
.wheel-disc{width:100%;height:100%;border-radius:50%;background:#FBF7EF;will-change:transform}
.wheel-disc svg{width:100%;height:100%;display:block;overflow:visible}
.wheel-sector{stroke:#211B12;stroke-opacity:.2;stroke-width:.35}
.wheel-unset .wheel-sector{opacity:.5}
.wheel-rim{fill:none;stroke:#211B12;stroke-width:.9}
.wheel-art-ring{fill:#FBF7EF;stroke:rgba(33,27,18,.2);stroke-width:.35}
.wheel-art{pointer-events:none}
.wheel-sector-label{fill:#211B12;font:600 2.6px/1 var(--sd-font-ui);paint-order:stroke;stroke:#FBF7EF;stroke-width:.7px;stroke-linejoin:round}
.wheel-win-outline{fill:none;stroke:#211B12;stroke-width:1.1;stroke-linejoin:round;opacity:0}
.wheel-disc svg>*{transition:opacity .2s linear .15s}
.wheel-landed svg>:is(.wheel-sector,.wheel-art-ring,.wheel-art,.wheel-sector-label):not(.win){opacity:.32}
.wheel-landed .wheel-win-outline{opacity:1}
.wheel-hub-button{position:absolute;inset:0;z-index:2;margin:auto;width:86px;height:86px;padding:0 .4rem;border-radius:50%;
  background:#2F6B3F;color:#FBF7EF;font:600 14px/1.15 var(--sd-font-ui);text-wrap:balance;
  box-shadow:0 0 0 3px #FBF7EF,0 0 0 4px #211B12,0 8px 18px rgba(33,27,18,.22);
  transition:transform var(--sd-t-micro) var(--sd-ease-list)}
.wheel-hub-button:active:not(:disabled){transform:scale(.94)}
.wheel-hub-button:disabled{background:#DDD4C3;color:#6E6455;cursor:not-allowed}
#wheelLayer .wheel-hub-button:focus-visible{outline-offset:6px}
.wheel-pointer{position:absolute;z-index:3;top:-14px;left:calc(50% - 11px);width:22px;height:20px;
  background:var(--sd-ink);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0}
.wheel-lower{width:min(100%,430px)}
.wheel-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.2rem .8rem;min-height:14px;margin:14px 0 12px;
  font:500 11.5px/1.2 var(--sd-font-ui);color:var(--sd-ink-2)}
.wheel-key{display:inline-flex;align-items:center;gap:.35rem}
.wheel-key i{width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(33,27,18,.25)}
.wheel-q{text-align:center;font:600 12px/1.3 var(--sd-font-ui);margin-bottom:8px}
.wheel-moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wheel-mood{min-height:52px;padding:4px;border:1px solid var(--sd-line);border-radius:12px;background:var(--sd-card);
  color:#211B12;font:500 11.5px/1.2 var(--sd-font-ui);text-wrap:balance}
.wheel-mood[aria-pressed="true"]{background:#211B12;border-color:var(--sd-ink);color:#FBF7EF}
.wheel-mood:disabled{opacity:.5;cursor:not-allowed}
.wheel-mood-copy{margin-top:8px;text-align:center;font:400 13px/1.35 var(--sd-font-ui);color:var(--sd-ink-2)}
.wheel-result{padding:14px;border-radius:16px;background:var(--sd-card);color:#211B12;box-shadow:var(--sd-shadow)}
.wheel-result-head{display:flex;align-items:center;gap:14px}
.wheel-result-art{width:72px;height:72px;flex:0 0 72px;border-radius:14px;object-fit:contain;background:#FBF7EF}
.wheel-result-label{font:600 10.5px/1.2 var(--sd-font-ui);letter-spacing:.12em;text-transform:uppercase;color:#6E6455}
.wheel-result-name{margin-top:2px;font:400 26px/1.1 var(--sd-font-display)}
.wheel-safety{margin-top:10px;padding:8px 10px;border-radius:10px;background:oklch(0.93 0.03 230);font:500 12.5px/1.35 var(--sd-font-ui)}
.wheel-result-btns{display:flex;gap:8px;margin-top:12px}
.wheel-result-btns button{flex:1;justify-content:center;min-height:44px;padding:0 .8rem;border:1px solid rgba(33,27,18,.25);
  border-radius:999px;color:#211B12;font:600 14px/1.2 var(--sd-font-ui);text-align:center}
.wheel-result-btns .fav-open{background:#2F6B3F;border-color:#2F6B3F;color:#FBF7EF}
@media (orientation:landscape) and (max-height:560px){
  #wheelLayer .wheel-body{width:min(100%,820px);display:grid;grid-template-columns:min(58vh,300px) minmax(260px,1fr);
    column-gap:1.5rem;align-items:center}
  .wheel-window{grid-column:2}.wheel-stage{grid-column:1;grid-row:1/span 2;width:min(58vh,300px)}.wheel-lower{grid-column:2}
}
@media (prefers-reduced-motion:reduce){
  .wheel-disc svg>*{transition:none}
}
</style>
</head>

          <circle class="wheel-rim" cx="50" cy="50" r="49"/>
          <circle cx="50" cy="50" r="15" fill="#2F6B3F" stroke="#FBF7EF" stroke-width="3"/>
        </svg>
        <span id="wheelEntryLabel"></span>
      </a>
    </div>
  </header>
  <main id="view"></main>
  <p id="routeLive" class="sr-only" aria-live="polite"></p>
  <div id="toast" class="toast" role="status" hidden><span></span><button type="button"></button></div>
</div>
